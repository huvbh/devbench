name: Materialise and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch single-file build into the repo
        run: |
          if [ ! -s index.html ]; then
            curl -fsSL -o index.html "https://aka.doubaocdn.com/s/LzZKuos5cm"
            test -s index.html
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "site: add single-file build [skip ci]"
            git push
          fi

  deploy:
    needs: materialise
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure the Pages site exists
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "GET pages -> $code"
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}')
            echo "POST pages -> $code"
            head -c 600 /tmp/pages-create.json || true
          fi

      - name: Configure Pages
        id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Report
        run: |
          if [ "${{ steps.cfg.outcome }}" != "success" ]; then
            echo "::warning::Pages still not available. Enable it under Settings > Pages > Source: GitHub Actions."
          fi
